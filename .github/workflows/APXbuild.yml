name: PX4 Firmware Build

on:
  workflow_dispatch:

jobs:
  build_px4_fmu_v5:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PX4 source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip git wget
        pip3 install --upgrade pip
        pip3 install -r requirements.txt

    - name: Setup PX4 toolchain
      run: |
        bash ./Tools/setup/ubuntu.sh

    - name: Build px4_fmu-v5_default
      run: |
        make px4_fmu-v5_default

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v3
      with:
        name: px4_fmu-v5_default
        path: build/px4_fmu-v5_default/px4_fmu-v5_default.px4
